name: probe-silson24
on:
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tool/probe_code.py > probe.txt 2>&1 || true
        env:
          DUR_API_KEY: ${{ secrets.DUR_API_KEY }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head -c 60000 probe.txt > body.txt
          gh issue create --title "probe ${{ github.run_number }}" --body-file body.txt
