name: check

# 빌드(릴리스) 없이 코드 검사와 테스트만
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 테스트
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log
      - name: 실패 보고
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -E "Error:|error:" -A4 test.log | head -n 80; echo '---'; tail -n 60 test.log; echo '```'; } > fail.md
          gh issue create --repo "${{ github.repository }}" --title "검사 ${{ github.run_number }} 실패" --body-file fail.md
