name: shop-update

# 복용 리포트의 영양제·생활용품 목록(docs/shop.json) 갱신: 네이버 가격비교(인기·최저가) + 쿠팡 파트너스
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shop-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 상품 갱신
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python3 tool/fetch_shop.py
      - name: 바뀌었으면 저장
        run: |
          if [ -n "$(git status --porcelain docs/shop.json)" ]; then
            git config user.name "shop-bot"
            git config user.email "shop-bot@users.noreply.github.com"
            git add docs/shop.json
            git commit -m "상품 목록 갱신 [skip ci]"
            git push
          fi
