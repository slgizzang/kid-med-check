name: dur-dose-update

# 식약처 DUR 용량주의·투여기간주의 목록(assets/dur_dose.json) 갱신 — 다음 앱 빌드에 들어간다
on:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: 목록 받기
        env:
          DUR_API_KEY: ${{ secrets.DUR_API_KEY }}
        run: python3 tool/fetch_dur_dose.py 2>&1 | sed "s/${DUR_API_KEY:-__none__}/***/g"
      - name: 바뀌었으면 저장
        run: |
          if [ -n "$(git status --porcelain assets/dur_dose.json)" ]; then
            git config user.name "dur-bot"
            git config user.email "dur-bot@users.noreply.github.com"
            git add assets/dur_dose.json
            git commit -m "DUR 용량·기간 목록 갱신"
            git pull --rebase -q
            git push
          fi
